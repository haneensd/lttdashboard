<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة توقع مغادرة العملاء — LTT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b14;
  --plane:#0a0f1c;
  --surface-1:#0d1424;
  --surface-2:#121b31;
  --surface-3:#182241;
  --border:rgba(148,178,225,0.14);
  --border-strong:rgba(148,178,225,0.28);
  --text-primary:#eef2fb;
  --text-secondary:#9db0cf;
  --text-muted:#66748f;
  --accent:#38bdf8;
  --accent-strong:#22d3ee;
  --accent-soft:rgba(56,189,248,0.14);
  --accent-line:#5fd0ff;
  --good:#34d399;
  --good-soft:rgba(52,211,153,0.14);
  --warning:#fbbf24;
  --warning-soft:rgba(251,191,36,0.14);
  --critical:#f87171;
  --critical-soft:rgba(248,113,113,0.16);
  --shadow:0 20px 50px -20px rgba(0,0,0,0.6);
  --radius-lg:18px;
  --radius-md:12px;
  --radius-sm:8px;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;overflow-x:hidden;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text-primary);
  font-family:'Tajawal','Cairo','Segoe UI',Tahoma,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.num-display,.brand-name{font-family:'Cairo','Tajawal','Segoe UI',sans-serif;}
h1,h2,h3,h4{margin:0;text-wrap:balance;}
button,select,input,textarea{font-family:inherit;color:inherit;}
a{color:inherit;text-decoration:none;}
::selection{background:var(--accent-soft);}
.tabular{font-variant-numeric:tabular-nums;}
.scrollbar-thin::-webkit-scrollbar{height:8px;width:8px;}
.scrollbar-thin::-webkit-scrollbar-track{background:transparent;}
.scrollbar-thin::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:8px;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}

/* ---------- layout shell ---------- */
#app{display:flex;min-height:100vh;}
.nav-rail{
  width:236px;flex:0 0 236px;background:linear-gradient(180deg,var(--surface-1),var(--plane));
  border-inline-start:1px solid var(--border);
  display:flex;flex-direction:column;padding:22px 16px;gap:28px;position:sticky;top:0;height:100vh;z-index:40;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;}
.brand-mark{
  width:38px;height:38px;border-radius:11px;flex:0 0 38px;
  background:radial-gradient(circle at 30% 25%, var(--accent-strong), #0d6b93 70%);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#04121c;
  box-shadow:0 6px 18px -6px rgba(56,189,248,0.6);
}
.brand-text{display:flex;flex-direction:column;line-height:1.15;}
.brand-name{font-weight:800;font-size:15px;letter-spacing:.2px;}
.brand-sub{font-size:11px;color:var(--text-muted);}
.nav-list{display:flex;flex-direction:column;gap:4px;}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--radius-sm);
  color:var(--text-secondary);font-size:14px;font-weight(500);font-weight:500;cursor:pointer;border:1px solid transparent;
  transition:background .15s,color .15s;
}
.nav-item svg{flex:0 0 18px;width:18px;height:18px;}
.nav-item:hover{background:var(--surface-2);color:var(--text-primary);}
.nav-item.active{background:var(--accent-soft);color:var(--accent);border-color:rgba(56,189,248,0.28);font-weight:700;}
.nav-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;}
.demo-badge{
  font-size:11px;color:var(--text-muted);background:var(--surface-2);border:1px solid var(--border);
  border-radius:999px;padding:8px 12px;display:flex;align-items:center;gap:8px;line-height:1.5;
}
.demo-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 6px;}

.main-col{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;
  padding:14px 26px;background:rgba(7,11,20,0.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.page-heading{display:flex;flex-direction:column;gap:2px;min-width:0;}
.page-heading h1{font-size:19px;font-weight:800;}
.page-heading span{font-size:12px;color:var(--text-muted);}
.topbar-spacer{flex:1 1 auto;}
.search-wrap{position:relative;width:280px;flex:0 0 280px;}
.search-wrap input{
  width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;
  padding:9px 40px 9px 14px;font-size:13px;color:var(--text-primary);
}
.search-wrap input::placeholder{color:var(--text-muted);}
.search-wrap input:focus{border-color:var(--border-strong);}
.search-icon{position:absolute;inset-inline-end:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;}
.search-results{
  position:absolute;top:calc(100% + 8px);inset-inline:0;background:var(--surface-2);border:1px solid var(--border-strong);
  border-radius:var(--radius-md);box-shadow:var(--shadow);overflow:hidden;z-index:60;max-height:320px;overflow-y:auto;display:none;
}
.search-results.open{display:block;}
.search-result-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:13px;cursor:pointer;gap:10px;}
.search-result-row:hover{background:var(--surface-3);}
.search-result-row .sr-name{font-weight:600;}
.search-result-row .sr-meta{color:var(--text-muted);font-size:11px;}

.icon-btn{
  position:relative;width:38px;height:38px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-secondary);flex:0 0 38px;
}
.icon-btn:hover{color:var(--text-primary);border-color:var(--border-strong);}
.badge-dot{
  position:absolute;top:-4px;inset-inline-end:-4px;background:var(--critical);color:#1a0505;font-size:10px;font-weight:800;
  min-width:17px;height:17px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--bg);padding:0 3px;
}
.dropdown-panel{
  position:absolute;top:calc(100% + 10px);inset-inline-end:0;width:340px;background:var(--surface-2);
  border:1px solid var(--border-strong);border-radius:var(--radius-md);box-shadow:var(--shadow);z-index:60;display:none;overflow:hidden;
}
.dropdown-panel.open{display:block;}
.dropdown-head{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
.dropdown-head span{font-weight:400;color:var(--text-muted);font-size:11px;}
.dropdown-list{max-height:320px;overflow-y:auto;}
.alert-row{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;border-bottom:1px solid var(--border);}
.alert-row:last-child{border-bottom:none;}
.alert-row:hover{background:var(--surface-3);}
.alert-row .ar-pct{font-weight:800;color:var(--critical);font-size:13px;flex:0 0 auto;}
.alert-row .ar-body{flex:1 1 auto;min-width:0;}
.alert-row .ar-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.alert-row .ar-meta{font-size:11px;color:var(--text-muted);}
.dropdown-empty{padding:24px 16px;text-align:center;color:var(--text-muted);font-size:12.5px;}

.btn{
  display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;
  cursor:pointer;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text-primary);white-space:nowrap;
}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn.primary{background:linear-gradient(180deg,var(--accent-strong),#0aa8d6);border-color:transparent;color:#04121c;}
.btn.primary:hover{filter:brightness(1.08);color:#04121c;}
.btn svg{width:15px;height:15px;flex:0 0 15px;}

main{padding:24px 26px 60px;flex:1 1 auto;min-width:0;max-width:100%;}
.view{display:none;animation:fadeIn .25s ease;min-width:0;max-width:100%;}
.view.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* ---------- KPI cards ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}
.kpi-grid>*,.grid-2>*,.grid-3>*{min-width:0;}
.kpi-card{
  background:linear-gradient(165deg,var(--surface-1),var(--surface-2));border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:18px 20px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;
}
.kpi-card::after{content:"";position:absolute;inset-inline-end:-30px;top:-30px;width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle, var(--kpi-glow,rgba(56,189,248,0.16)), transparent 70%);}
.kpi-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.kpi-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);flex:0 0 34px;}
.kpi-icon svg{width:17px;height:17px;}
.kpi-label{font-size:12.5px;color:var(--text-secondary);font-weight:500;}
.kpi-value{font-size:27px;font-weight:800;letter-spacing:-.02em;}
.kpi-delta{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;width:fit-content;padding:3px 8px;border-radius:999px;}
.kpi-delta.up-bad{color:var(--critical);background:var(--critical-soft);}
.kpi-delta.up-good{color:var(--good);background:var(--good-soft);}
.kpi-delta.down-good{color:var(--good);background:var(--good-soft);}
.kpi-delta.neutral{color:var(--text-muted);background:var(--surface-3);}

/* ---------- generic cards / grid ---------- */
.grid-2{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;margin-bottom:16px;align-items:stretch;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px;}
.card{
  background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;
  display:flex;flex-direction:column;gap:14px;min-width:0;
}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.card-title{font-size:14.5px;font-weight:800;}
.card-sub{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
.card-tag{font-size:10.5px;font-weight:700;color:var(--text-muted);background:var(--surface-3);padding:4px 9px;border-radius:999px;white-space:nowrap;}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--text-secondary);}
.legend-item{display:flex;align-items:center;gap:6px;}
.legend-swatch{width:10px;height:10px;border-radius:3px;flex:0 0 10px;}
.legend-swatch.line{width:14px;height:2px;border-radius:2px;}

/* tooltip */
#viz-tooltip{
  position:fixed;z-index:200;pointer-events:none;background:#0a1120;border:1px solid var(--border-strong);
  border-radius:10px;padding:9px 12px;font-size:12px;box-shadow:var(--shadow);opacity:0;transform:translate(-9999px,-9999px);
  transition:opacity .1s;min-width:120px;
}
#viz-tooltip.show{opacity:1;}
#viz-tooltip .tt-title{font-weight:800;margin-bottom:5px;color:var(--text-primary);font-size:11.5px;}
.tt-row{display:flex;align-items:center;gap:7px;justify-content:space-between;}
.tt-key{display:flex;align-items:center;gap:6px;color:var(--text-secondary);}
.tt-line{width:11px;height:2px;border-radius:2px;flex:0 0 11px;}
.tt-val{font-weight:800;color:var(--text-primary);}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;}
.pill .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;}
.pill.risk-low{background:var(--good-soft);color:var(--good);}
.pill.risk-low .dot{background:var(--good);}
.pill.risk-med{background:var(--warning-soft);color:var(--warning);}
.pill.risk-med .dot{background:var(--warning);}
.pill.risk-high{background:var(--critical-soft);color:var(--critical);}
.pill.risk-high .dot{background:var(--critical);}

/* table */
.table-wrap{overflow-x:auto;border-radius:var(--radius-md);border:1px solid var(--border);}
table.dtable{width:100%;border-collapse:collapse;font-size:13px;min-width:760px;}
table.dtable thead th{
  text-align:right;padding:11px 14px;background:var(--surface-2);color:var(--text-muted);font-size:11px;font-weight:700;
  border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;
}
table.dtable thead th.sortable:hover{color:var(--text-primary);}
table.dtable thead th .sort-ind{margin-inline-start:4px;opacity:.5;font-size:10px;}
table.dtable tbody td{padding:11px 14px;border-bottom:1px solid var(--border);color:var(--text-secondary);white-space:nowrap;}
table.dtable tbody tr{cursor:pointer;transition:background .12s;}
table.dtable tbody tr:hover{background:var(--surface-2);}
table.dtable tbody tr:last-child td{border-bottom:none;}
table.dtable tbody td.name-cell{color:var(--text-primary);font-weight:700;}
table.dtable tbody td.num{font-variant-numeric:tabular-nums;}
.row-alert{box-shadow:inset 3px 0 0 var(--critical);}
.table-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.mini-search{flex:0 0 220px;position:relative;}
.mini-search input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;font-size:12.5px;}
.table-empty{padding:34px;text-align:center;color:var(--text-muted);font-size:13px;}

/* filters */
.filter-bar{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;background:var(--surface-1);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:18px;}
.filter-field{display:flex;flex-direction:column;gap:6px;min-width:150px;}
.filter-field label{font-size:11px;color:var(--text-muted);font-weight:700;}
.filter-field select,.filter-field input[type=range]{
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;font-size:12.5px;color:var(--text-primary);
}
.filter-field .range-value{font-size:11px;color:var(--text-secondary);}
.filter-reset{margin-inline-start:auto;}
.filter-count{font-size:12px;color:var(--text-muted);align-self:center;}

/* segments */
.segment-card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;display:flex;flex-direction:column;gap:10px;}
.segment-card .seg-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.segment-card .seg-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 32px;}
.segment-card .seg-icon svg{width:16px;height:16px;}
.segment-card .seg-count{font-size:22px;font-weight:800;}
.segment-card .seg-title{font-size:13px;font-weight:700;}
.segment-card .seg-desc{font-size:12px;color:var(--text-muted);line-height:1.6;}
.segment-card .seg-action{font-size:11.5px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:8px;border-top:1px solid var(--border);}

/* detail page */
.detail-grid{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start;}
.profile-card{display:flex;flex-direction:column;gap:16px;text-align:center;align-items:center;}
.avatar{width:74px;height:74px;border-radius:22px;background:linear-gradient(160deg,var(--accent-soft),var(--surface-3));
  display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:var(--accent);border:1px solid var(--border-strong);}
.profile-name{font-size:17px;font-weight:800;}
.profile-id{font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums;}
.profile-facts{width:100%;display:flex;flex-direction:column;gap:0;text-align:right;border-top:1px solid var(--border);}
.pf-row{display:flex;justify-content:space-between;padding:10px 2px;border-bottom:1px solid var(--border);font-size:12.5px;gap:10px;}
.pf-row:last-child{border-bottom:none;}
.pf-row .pf-k{color:var(--text-muted);}
.pf-row .pf-v{font-weight:700;color:var(--text-primary);}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-secondary);cursor:pointer;margin-bottom:14px;width:fit-content;}
.back-link:hover{color:var(--accent);}
.back-link svg{width:15px;height:15px;}
.gauge-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0 2px;}
.gauge-caption{font-size:12px;color:var(--text-muted);text-align:center;}
.factor-row{display:flex;flex-direction:column;gap:6px;}
.factor-top{display:flex;justify-content:space-between;font-size:12.5px;}
.factor-top .f-name{color:var(--text-secondary);font-weight:600;}
.factor-top .f-val{font-weight:800;font-variant-numeric:tabular-nums;}
.factor-track{height:7px;border-radius:5px;background:var(--surface-3);overflow:hidden;}
.factor-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent-strong));}
.timeline{display:flex;flex-direction:column;}
.tl-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.tl-item:last-child{border-bottom:none;}
.tl-dot-wrap{display:flex;flex-direction:column;align-items:center;flex:0 0 10px;}
.tl-dot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex:0 0 9px;}
.tl-line{flex:1 1 auto;width:1px;background:var(--border);margin-top:2px;}
.tl-body{flex:1 1 auto;display:flex;flex-direction:column;gap:2px;}
.tl-head{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:700;}
.tl-date{color:var(--text-muted);font-weight:500;font-size:11px;font-variant-numeric:tabular-nums;}
.tl-desc{font-size:12px;color:var(--text-secondary);}
.action-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.action-btn{
  display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius-md);background:var(--surface-2);
  border:1px solid var(--border);cursor:pointer;text-align:right;font-size:12.5px;font-weight:700;transition:all .15s;
}
.action-btn:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
.action-btn.done{border-color:var(--good);background:var(--good-soft);color:var(--good);}
.action-btn svg{width:16px;height:16px;flex:0 0 16px;}
.toast{
  position:fixed;bottom:24px;inset-inline-start:50%;transform:translateX(50%) translateY(20px);background:var(--surface-2);
  border:1px solid var(--good);color:var(--good);padding:12px 20px;border-radius:999px;font-size:13px;font-weight:700;
  box-shadow:var(--shadow);z-index:500;opacity:0;transition:all .25s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(50%) translateY(0);}

.empty-state{display:flex;flex-direction:column;align-items:center;gap:10px;padding:50px 20px;color:var(--text-muted);text-align:center;}
.empty-state svg{width:38px;height:38px;opacity:.5;}

/* mobile */
.nav-toggle{display:none;}
@media (max-width:980px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .grid-2,.grid-3{grid-template-columns:1fr;}
  .detail-grid{grid-template-columns:1fr;}
  .action-grid{grid-template-columns:1fr;}
}
@media (max-width:760px){
  .nav-rail{position:fixed;inset-inline-start:0;top:0;bottom:0;transform:translateX(102%);transition:transform .2s;box-shadow:var(--shadow);}
  .nav-rail.open{transform:translateX(0);}
  .nav-toggle{display:flex;}
  .search-wrap{width:150px;flex:0 0 150px;}
  .kpi-grid{grid-template-columns:1fr;}
  main{padding:16px 14px 50px;}
  .topbar{padding:12px 14px;}
  .filter-bar{padding:14px;}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}
</style>
</head>
<body>
<div id="app">
  <aside class="nav-rail" id="navRail">
    <div class="brand">
      <div class="brand-mark">LT</div>
      <div class="brand-text">
        <span class="brand-name">LTT للاتصالات</span>
        <span class="brand-sub">توقع مغادرة العملاء</span>
      </div>
    </div>
    <nav class="nav-list" id="navList">
      <div class="nav-item" data-page="overview">

<script>
(function(){
"use strict";

/* ============================= RNG & helpers ============================= */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20260819);
const randInt = (min,max) => Math.floor(rand()*(max-min+1))+min;
const choice = arr => arr[Math.floor(rand()*arr.length)];
function weightedChoice(pairs){
  const total = pairs.reduce((s,p)=>s+p[1],0);
  let r = rand()*total;
  for(const [val,w] of pairs){ if(r<w) return val; r-=w; }
  return pairs[pairs.length-1][0];
}
function fmtNum(n){ return Math.round(n).toLocaleString('en-US'); }
function fmtPct(n,d){ return n.toFixed(d==null?1:d) + '٪'; }
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

/* ============================= reference data ============================= */
const REGIONS = ['طرابلس','بنغازي','مصراتة','الزاوية','سبها','البيضاء','زليتن','صبراتة','طبرق','الخمس'];
const PLANS = ['4G','ADSL','VDSL','FWA','Fiber','Libya Phone','MyLTT'];
const PLAN_BASE_BILL = {'4G':60,'ADSL':45,'VDSL':70,'FWA':95,'Fiber':145,'Libya Phone':25,'MyLTT':35};
const PLAN_USAGE_RANGE = {'4G':[6,26],'ADSL':[20,55],'VDSL':[45,110],'FWA':[70,180],'Fiber':[120,400],'Libya Phone':[0.5,3],'MyLTT':[1,8]};
const PLAN_WEIGHTS = [['4G',26],['ADSL',16],['VDSL',14],['FWA',10],['Fiber',18],['Libya Phone',9],['MyLTT',7]];
const CONTRACTS = ['سنوي','شهري','بدون عقد'];
const AGE_BANDS = ['18-25','26-35','36-45','46-60','60+'];
const PAYMENT_STATUSES = ['مدفوع','متأخر','معلق'];
const MALE_NAMES = ['محمد','أحمد','علي','عمر','خالد','إبراهيم','يوسف','عبدالله','مصطفى','سالم','حسن','فيصل','نوري','رمضان','الصادق','عادل','ياسين','وليد','هشام','طارق'];
const FEMALE_NAMES = ['فاطمة','مريم','آمنة','خديجة','زينب','نور','سارة','هدى','ليلى','أسماء','سلمى','إيمان','رانيا','نجاة','حنان','سعاد','وفاء','منى','راوية','بشرى'];
const FAMILY_NAMES = ['الزوي','المبروك','الفيتوري','الورفلي','الرياني','البرعصي','التاجوري','الدرناوي','الشريف','القمودي','الفزاني','البوسيفي','النعاس','الككلي','الزليتني','التركي','الحداد','المصراتي','الغماري','العبيدي'];

const REASON_LABELS = {
  high_bill:'ارتفاع الفاتورة', network:'ضعف الشبكة', complaints:'كثرة الشكاوى',
  competitor:'عروض المنافسين', contract_end:'انتهاء العقد', other:'أسباب أخرى'
};
const ACTION_BY_REASON = {
  high_bill:'عرض خصم أو تعديل الباقة', network:'جدولة فحص فني للشبكة', complaints:'مكالمة استباقية من فريق الدعم',
  competitor:'تقديم عرض احتفاظ مخصص', contract_end:'تجديد العقد بعرض تفضيلي', other:'مراجعة يدوية من فريق الاحتفاظ',
  none_low:'متابعة دورية للحساب', none_med:'مراجعة عامة لتجربة العميل'
};
const FACTOR_LABELS = {
  high_bill:'ارتفاع قيمة الفاتورة عن متوسط الباقة', network:'شكاوى متعلقة بجودة الشبكة',
  complaints:'تكرار الشكاوى ومكالمات الدعم', competitor:'تفاعل مع عروض من منافسين',
  contract_end:'اقتراب انتهاء العقد', payment:'تأخر أو تعثر في سداد الفاتورة',
  satisfaction:'انخفاض درجة رضا العميل', tenure_new:'عميل جديد ضمن أول 6 أشهر', noContract:'عدم وجود عقد ملزم'
};

/* ============================= data generation ============================= */
const N = 1500;
const TODAY = new Date(2026,7,19);

function monthsAgo(d, months){ const r = new Date(d); r.setMonth(r.getMonth()-months); return r; }
function fmtDate(d){ return d.toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'}); }

function buildCustomer(i){
  const gender = rand()<0.52 ? 'm':'f';
  const first = gender==='m' ? choice(MALE_NAMES) : choice(FEMALE_NAMES);
  const name = first+' '+choice(FAMILY_NAMES);
  const region = choice(REGIONS);
  const plan_type = weightedChoice(PLAN_WEIGHTS);
  const tenure_months = randInt(1,120);
  const baseBill = PLAN_BASE_BILL[plan_type];
  const monthly_bill = Math.round(baseBill * (0.75 + rand()*0.75));
  const [uMin,uMax] = PLAN_USAGE_RANGE[plan_type];
  const average_data_usage = +(uMin + rand()*(uMax-uMin)).toFixed(1);

  let complaints_count;
  { const r=rand(); complaints_count = r<0.52?0 : r<0.78?randInt(1,2) : r<0.93?randInt(3,4) : randInt(5,8); }
  let support_calls;
  { const r=rand(); support_calls = r<0.45?randInt(0,1) : r<0.75?randInt(2,3) : r<0.92?randInt(4,6) : randInt(7,11); }

  const payment_status = weightedChoice([['مدفوع',75],['متأخر',18],['معلق',7]]);
  const contract_type = weightedChoice([['سنوي',40],['شهري',35],['بدون عقد',25]]);
  let contract_end_days = null;
  if(contract_type==='سنوي') contract_end_days = randInt(-10,365);
  else if(contract_type==='شهري') contract_end_days = randInt(-5,30);

  const competitor_offer_flag = rand() < 0.16;
  const network_issue_flag = rand() < (complaints_count>=3 ? 0.42 : 0.16);

  let satisfaction_score = 10 - complaints_count*0.7 - support_calls*0.35 + randInt(-2,2);
  satisfaction_score = clamp(Math.round(satisfaction_score),1,10);

  const age_band = choice(AGE_BANDS);
  const join_date = monthsAgo(TODAY, tenure_months);

  const contrib = {
    high_bill: monthly_bill > baseBill*1.25 ? (monthly_bill-baseBill) : 0,
    network: network_issue_flag ? 22 : 0,
    complaints: complaints_count*5 + support_calls*3,
    competitor: competitor_offer_flag ? 18 : 0,
    contract_end: (contract_end_days!=null && contract_end_days>=0 && contract_end_days<=45) ? (46-contract_end_days) : 0,
    payment: payment_status==='معلق'?20:payment_status==='متأخر'?10:0,
    satisfaction: (10-satisfaction_score)*3,
    tenure_new: tenure_months<6?18:tenure_months<12?9:0,
    noContract: contract_type==='بدون عقد'?8:0
  };
  const loyaltyRelief = tenure_months>36 ? 12 : 0;
  const raw_score = Object.values(contrib).reduce((a,b)=>a+b,0) - loyaltyRelief + randInt(-6,6);

  return {
    customer_id:'LTT-'+(100000+i), customer_name:name, gender, region, plan_type, tenure_months,
    monthly_bill, average_data_usage, complaints_count, support_calls, payment_status,
    satisfaction_score, contract_type, contract_end_days, age_band, join_date,
    competitor_offer_flag, network_issue_flag, contrib, raw_score
  };
}

const customers = [];
for(let i=0;i<N;i++) customers.push(buildCustomer(i));

/* percentile-based churn probability & risk banding, so proportions match the
   company-wide KPIs regardless of the raw scoring weights above */
const REASON_KEYS = ['high_bill','network','complaints','competitor','contract_end'];
(function assignRisk(){
  const order = customers.map((c,idx)=>idx).sort((a,b)=>customers[b].raw_score-customers[a].raw_score);
  const k1 = Math.round(N*0.0737), k2 = Math.round(N*0.2237);
  order.forEach((idx,rank)=>{
    const c = customers[idx];
    let prob, risk_level;
    if(rank<k1){ const t=rank/Math.max(k1,1); prob = 97 - t*22; risk_level='مرتفع'; }
    else if(rank<k2){ const u=(rank-k1)/Math.max(k2-k1,1); prob = 74 - u*29; risk_level='متوسط'; }
    else { const v=(rank-k2)/Math.max(N-k2,1); prob = 44 - v*42; risk_level='منخفض'; }
    prob = clamp(prob + (rand()*1.8-0.9), 1, 98.5);
    c.churn_probability = +prob.toFixed(1);
    c.risk_level = risk_level;

    let bestKey=null, bestVal=6;
    REASON_KEYS.forEach(k=>{ if(c.contrib[k]>bestVal){ bestVal=c.contrib[k]; bestKey=k; } });
    if(risk_level==='منخفض'){
      c.churn_reason = null;
      c.recommended_action = ACTION_BY_REASON.none_low;
    } else if(bestKey){
      c.churn_reason = REASON_LABELS[bestKey];
      c.recommended_action = ACTION_BY_REASON[bestKey];
    } else {
      c.churn_reason = REASON_LABELS.other;
      c.recommended_action = risk_level==='مرتفع' ? ACTION_BY_REASON.other : ACTION_BY_REASON.none_med;
    }
  });
})();

/* company-wide (large-N) KPIs as supplied by the business spec */
const KPI = { total_customers:250000, at_risk_customers:18420, predicted_churn_rate:7.4, revenue_at_risk_musd:4.8 };
const CHURN_TREND_12M = [6.1,6.3,6.0,6.4,6.7,6.5,6.9,7.0,6.8,7.2,7.1,7.4];
const TREND_MONTH_LABELS = (()=>{ const labels=[]; for(let i=11;i>=0;i--){ const d=monthsAgo(TODAY,i); labels.push(d.toLocaleDateString('ar-LY-u-nu-latn',{month:'short'})); } return labels; })();

/* ============================= aggregation helpers ============================= */
function riskColor(level){ return level==='مرتفع'?'var(--critical)':level==='متوسط'?'var(--warning)':'var(--good)'; }
function riskColorHex(level){ return level==='مرتفع'?'#f87171':level==='متوسط'?'#fbbf24':'#34d399'; }
function pillClass(level){ return level==='مرتفع'?'risk-high':level==='متوسط'?'risk-med':'risk-low'; }

function applyFilters(list, f){
  return list.filter(c=>{
    if(f.region && c.region!==f.region) return false;
    if(f.plan && c.plan_type!==f.plan) return false;
    if(f.age && c.age_band!==f.age) return false;
    if(f.tenureMax!=null && c.tenure_months>f.tenureMax) return false;
    return true;
  });
}
/* "churn rate" for a group = share of its customers in the high-risk band,
   the same definition behind the company-wide 7.4% KPI, so the two stay comparable */
function groupRate(list, keyFn){
  const map = new Map();
  list.forEach(c=>{
    const k = keyFn(c);
    if(!map.has(k)) map.set(k,{n:0,high:0});
    const g = map.get(k); g.n++; if(c.risk_level==='مرتفع') g.high++;
  });
  return [...map.entries()].map(([label,g])=>({label, rate:(g.high/g.n)*100, n:g.n}));
}

/* ============================= state ============================= */
const state = { page:'overview', filters:{region:'',plan:'',age:'',tenureMax:120}, selectedId:null, ovSearch:'', ovSort:{key:'churn_probability',dir:-1} };

/* ============================= tiny SVG chart engine ============================= */
const SVGNS = 'http://www.w3.org/2000/svg';
function el(tag,attrs,parent){
  const e = document.createElementNS(SVGNS,tag);
  if(attrs) for(const k in attrs) e.setAttribute(k,attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}
const tooltipEl = document.getElementById('viz-tooltip');
function showTooltip(x,y,html){
  tooltipEl.innerHTML = html;
  tooltipEl.classList.add('show');
  const pad=14; const w=tooltipEl.offsetWidth, h=tooltipEl.offsetHeight;
  let left = x+pad, top = y - h/2;
  if(left + w > window.innerWidth-8) left = x - w - pad;
  top = clamp(top, 8, window.innerHeight-h-8);
  tooltipEl.style.transform = `translate(${left}px, ${top}px)`;
}
function hideTooltip(){ tooltipEl.classList.remove('show'); }

function lineAreaChart(container, series, opts){
  opts = opts||{};
  const w = container.clientWidth||600, h = opts.height||220;
  const padL=8,padR=8,padT=16,padB=26;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const svg = el('svg',{viewBox:`0 0 ${w} ${h}`,width:'100%',height:h,style:'display:block;overflow:visible;'});
  const maxV = Math.max(...series.map(s=>s.value))*1.18;
  const minV = 0;
  const n = series.length;
  /* RTL: index 0 (earliest) sits on the right edge, latest on the left */
  const xAt = i => padL + (plotW - (i/(n-1))*plotW);
  const yAt = v => padT + plotH - ((v-minV)/(maxV-minV))*plotH;

  for(let g=0; g<=3; g++){
    const gv = minV + (maxV-minV)*g/3;
    const gy = yAt(gv);
    el('line',{x1:padL,x2:w-padR,y1:gy,y2:gy,stroke:'var(--border)','stroke-width':1},svg);
    const t = el('text',{x:w-padR,y:gy-4,'text-anchor':'end',fill:'var(--text-muted)','font-size':10},svg);
    t.textContent = gv.toFixed(1)+'٪';
  }

  const gradId = 'lg'+Math.random().toString(36).slice(2);
  const defs = el('defs',null,svg);
  const grad = el('linearGradient',{id:gradId,x1:'0',y1:'0',x2:'0',y2:'1'},defs);
  el('stop',{offset:'0%','stop-color':'var(--accent-line)','stop-opacity':0.32},grad);
  el('stop',{offset:'100%','stop-color':'var(--accent-line)','stop-opacity':0},grad);

  let areaD = `M ${xAt(0)} ${yAt(0)} `;
  series.forEach((s,i)=>areaD += `L ${xAt(i)} ${yAt(s.value)} `);
  areaD += `L ${xAt(n-1)} ${yAt(0)} Z`;
  el('path',{d:areaD, fill:`url(#${gradId})`, stroke:'none'},svg);

  let lineD='';
  series.forEach((s,i)=>{ lineD += (i===0?'M ':'L ') + xAt(i)+' '+yAt(s.value)+' '; });
  el('path',{d:lineD, fill:'none', stroke:'var(--accent-line)','stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'},svg);

  const lastX = xAt(n-1), lastY = yAt(series[n-1].value);
  el('circle',{cx:lastX,cy:lastY,r:5,fill:'var(--accent-strong)',stroke:'var(--surface-1)','stroke-width':2},svg);
  const lbl = el('text',{x:lastX,y:lastY-11,'text-anchor':'middle',fill:'var(--text-primary)','font-size':11,'font-weight':800},svg);
  lbl.textContent = series[n-1].value.toFixed(1)+'٪';

  series.forEach((s,i)=>{
    if(i%2!==0 && n>8) return;
    const t = el('text',{x:xAt(i),y:h-8,'text-anchor':'middle',fill:'var(--text-muted)','font-size':10},svg);
    t.textContent = s.label;
  });

  const hit = el('rect',{x:padL,y:0,width:plotW,height:h,fill:'transparent'},svg);
  const cross = el('line',{x1:0,x2:0,y1:padT,y2:padT+plotH,stroke:'var(--border-strong)','stroke-width':1,opacity:0},svg);
  const crossDot = el('circle',{r:4,fill:'var(--accent-strong)',stroke:'var(--surface-1)','stroke-width':2,opacity:0},svg);
  hit.addEventListener('pointermove', e=>{
    const rect = svg.getBoundingClientRect();
    const mx = (e.clientX-rect.left) * (w/rect.width);
    let idx = Math.round(((plotW - (mx-padL)) / plotW) * (n-1));
    idx = clamp(idx,0,n-1);
    const cx = xAt(idx), cy = yAt(series[idx].value);
    cross.setAttribute('x1',cx); cross.setAttribute('x2',cx); cross.setAttribute('opacity',1);
    crossDot.setAttribute('cx',cx); crossDot.setAttribute('cy',cy); crossDot.setAttribute('opacity',1);
    showTooltip(e.clientX,e.clientY, `<div class="tt-title">${esc(series[idx].label)}</div>
      <div class="tt-row"><span class="tt-key"><span class="tt-line" style="background:var(--accent-line)"></span>معدل المغادرة</span><span class="tt-val">${series[idx].value.toFixed(1)}٪</span></div>`);
  });
  hit.addEventListener('pointerleave', ()=>{ cross.setAttribute('opacity',0); crossDot.setAttribute('opacity',0); hideTooltip(); });
  svg.appendChild(crossDot);
  container.innerHTML=''; container.appendChild(svg);
}

function donutChart(container, segments, opts){
  opts = opts||{};
  const w = container.clientWidth||220, h = opts.height||220;
  const cx=w/2, cy=h/2, rOuter=Math.min(w,h)/2-6, rInner=rOuter*0.62;
  const total = segments.reduce((s,x)=>s+x.value,0);
  const svg = el('svg',{viewBox:`0 0 ${w} ${h}`,width:'100%',height:h,style:'display:block;'});
  let angle = -Math.PI/2;
  const gapDeg = 0.018;
  segments.forEach(seg=>{
    const frac = seg.value/total;
    const a0 = angle+gapDeg, a1 = angle + frac*2*Math.PI - gapDeg;
    angle += frac*2*Math.PI;
    const large = (a1-a0) > Math.PI ? 1:0;
    const p = (r,a)=>[cx+r*Math.cos(a), cy+r*Math.sin(a)];
    const [x0,y0]=p(rOuter,a0), [x1,y1]=p(rOuter,a1), [x2,y2]=p(rInner,a1), [x3,y3]=p(rInner,a0);
    const d = `M ${x0} ${y0} A ${rOuter} ${rOuter} 0 ${large} 1 ${x1} ${y1} L ${x2} ${y2} A ${rInner} ${rInner} 0 ${large} 0 ${x3} ${y3} Z`;
    const path = el('path',{d,fill:seg.color,stroke:'var(--surface-1)','stroke-width':2, style:'cursor:pointer;transition:opacity .12s;'},svg);
    path.addEventListener('pointerenter', e=>{ path.setAttribute('opacity',0.82);
      showTooltip(e.clientX,e.clientY, `<div class="tt-title">${esc(seg.label)}</div>
        <div class="tt-row"><span class="tt-key"><span class="tt-line" style="background:${seg.color}"></span>عدد العملاء</span><span class="tt-val">${fmtNum(seg.value)}</span></div>
        <div class="tt-row"><span class="tt-key">النسبة</span><span class="tt-val">${(frac*100).toFixed(1)}٪</span></div>`);
    });
    path.addEventListener('pointermove', e=> showTooltip(e.clientX,e.clientY, tooltipEl.innerHTML));
    path.addEventListener('pointerleave', ()=>{ path.setAttribute('opacity',1); hideTooltip(); });
  });
  const centerVal = opts.centerValue!=null ? opts.centerValue : fmtNum(total);
  const t1 = el('text',{x:cx,y:cy-2,'text-anchor':'middle',fill:'var(--text-primary)','font-size':22,'font-weight':800},svg);
  t1.textContent = centerVal;
  const t2 = el('text',{x:cx,y:cy+17,'text-anchor':'middle',fill:'var(--text-muted)','font-size':10.5},svg);
  t2.textContent = opts.centerLabel||'إجمالي';
  container.innerHTML=''; container.appendChild(svg);
}

function barChartH(container, items, opts){
  opts = opts||{};
  const w = container.clientWidth||600;
  const rowH = opts.rowH||30, gap=10, padL=8, padR=54, labelW=opts.labelW||96;
  const h = items.length*rowH + (items.length-1)*gap + 10;
  const plotW = w-padL-padR-labelW;
  const maxV = opts.max!=null?opts.max:Math.max(...items.map(i=>i.value))*1.08;
  const svg = el('svg',{viewBox:`0 0 ${w} ${h}`,width:'100%',height:h,style:'display:block;overflow:visible;'});
  items.forEach((it,i)=>{
    const y = i*(rowH+gap);
    const barLen = clamp((it.value/maxV)*plotW,2,plotW);
    /* RTL: bar grows from the right edge (near the label) toward the left */
    const barStartX = padL + labelW + (plotW-barLen);
    el('rect',{x:padL+labelW,y,width:plotW,height:rowH,rx:6,fill:'var(--surface-3)'},svg);
    const label = el('text',{x:padL+labelW-10,y:y+rowH/2+4,'text-anchor':'end',fill:'var(--text-secondary)','font-size':12},svg);
    label.textContent = it.label;
    const bar = el('rect',{x:barStartX,y,width:barLen,height:rowH,rx:6,fill:it.color,style:'cursor:pointer;'},svg);
    const valText = el('text',{x:barStartX-8,y:y+rowH/2+4,'text-anchor':'end',fill:'var(--text-primary)','font-size':11.5,'font-weight':800},svg);
    valText.textContent = opts.fmt ? opts.fmt(it.value) : it.value.toFixed(1);
    const hit = el('rect',{x:padL+labelW,y,width:plotW,height:rowH,fill:'transparent',style:'cursor:pointer;'},svg);
    const onEnter = e=>{ bar.setAttribute('opacity',0.82);
      showTooltip(e.clientX,e.clientY, `<div class="tt-title">${esc(it.label)}</div>
        <div class="tt-row"><span class="tt-key"><span class="tt-line" style="background:${it.color}"></span>القيمة</span><span class="tt-val">${opts.fmt?opts.fmt(it.value):it.value.toFixed(1)}</span></div>${it.sub?`<div class="tt-row"><span class="tt-key">${it.sub.k}</span><span class="tt-val">${it.sub.v}</span></div>`:''}`);
    };
    hit.addEventListener('pointerenter', onEnter);
    hit.addEventListener('pointermove', e=>onEnter(e));
    hit.addEventListener('pointerleave', ()=>{ bar.setAttribute('opacity',1); hideTooltip(); });
  });
  container.innerHTML=''; container.appendChild(svg);
}

function scatterChart(container, points, opts){
  opts = opts||{};
  const w = container.clientWidth||600, h = opts.height||280;
  const padL=40,padR=16,padT=16,padB=34;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const svg = el('svg',{viewBox:`0 0 ${w} ${h}`,width:'100%',height:h,style:'display:block;overflow:visible;'});
  const xMax = opts.xMax, yMax = opts.yMax;
  /* RTL: x increases from right to left */
  const xAt = x => padL + (plotW - (x/xMax)*plotW);
  const yAt = y => padT + plotH - (y/yMax)*plotH;
  for(let g=0;g<=4;g++){
    const gy = padT + plotH*g/4;
    el('line',{x1:padL,x2:w-padR,y1:gy,y2:gy,stroke:'var(--border)','stroke-width':1},svg);
  }
  el('text',{x:w-padR,y:h-10,'text-anchor':'end',fill:'var(--text-muted)','font-size':10.5}).textContent='';
  const xLabel = el('text',{x:padL+plotW/2,y:h-6,'text-anchor':'middle',fill:'var(--text-muted)','font-size':10.5},svg); xLabel.textContent = opts.xLabel||'';
  const yLabel = el('text',{x:12,y:padT+10,'text-anchor':'start',fill:'var(--text-muted)','font-size':10.5,transform:`rotate(0)`},svg); yLabel.textContent = opts.yLabel||'';
  points.forEach(pt=>{
    const cx=xAt(pt.x), cy=yAt(pt.y);
    const hit = el('circle',{cx,cy,r:12,fill:'transparent',style:'cursor:pointer;'},svg);
    const dot = el('circle',{cx,cy,r:4.5,fill:pt.color,stroke:'var(--surface-1)','stroke-width':1.5,opacity:0.85},svg);
    const onEnter = e=>{ dot.setAttribute('r',6.5);
      showTooltip(e.clientX,e.clientY, `<div class="tt-title">${esc(pt.name)}</div>
        <div class="tt-row"><span class="tt-key">${esc(opts.xLabel)}</span><span class="tt-val">${pt.x}</span></div>
        <div class="tt-row"><span class="tt-key">${esc(opts.yLabel)}</span><span class="tt-val">${fmtNum(pt.y)}</span></div>
        <div class="tt-row"><span class="tt-key"><span class="tt-line" style="background:${pt.color}"></span>المخاطرة</span><span class="tt-val">${pt.risk}</span></div>`);
    };
    hit.addEventListener('pointerenter', onEnter);
    hit.addEventListener('pointermove', onEnter);
    hit.addEventListener('pointerleave', ()=>{ dot.setAttribute('r',4.5); hideTooltip(); });
  });
  container.innerHTML=''; container.appendChild(svg);
}

function gaugeChart(container, pct, color){
  const w=200,h=120, cx=100, cy=110, r=86;
  const svg = el('svg',{viewBox:`0 0 ${w} ${h}`,width:'220',height:'132',style:'display:block;'});
  function polar(ang,rr){ return [cx+rr*Math.cos(ang), cy - rr*Math.sin(ang)]; }
  function describeArc(startAng,endAng,rr){
    const [x0,y0]=polar(startAng,rr), [x1,y1]=polar(endAng,rr);
    const large = Math.abs(endAng-startAng)>Math.PI?1:0;
    return `M ${x0} ${y0} A ${rr} ${rr} 0 ${large} 0 ${x1} ${y1}`;
  }
  el('path',{d:describeArc(Math.PI,0,r), fill:'none', stroke:'var(--surface-3)','stroke-width':16,'stroke-linecap':'round'},svg);
  const frac = clamp(pct/100,0,1);
  const endAngle = Math.PI - frac*Math.PI;
  el('path',{d:describeArc(Math.PI,endAngle,r), fill:'none', stroke:color,'stroke-width':16,'stroke-linecap':'round'},svg);
  const t = el('text',{x:cx,y:cy-18,'text-anchor':'middle',fill:'var(--text-primary)','font-size':30,'font-weight':800},svg);
  t.textContent = pct.toFixed(1)+'٪';
  container.innerHTML=''; container.appendChild(svg);
}

/* ---------------- Detail page ---------------- */
function seededSub(idOffset){ return mulberry32(20260819 + idOffset); }

function buildTimeline(c, idx){
  const r = seededSub(idx*7+3);
  const events = [];
  const templates = {
    complaint:['شكوى بشأن ضعف تغطية الشبكة','شكوى بخصوص بطء سرعة الإنترنت','شكوى متعلقة بانقطاع متكرر للخدمة'],
    support:['مكالمة دعم فني لحل مشكلة اتصال','تواصل مع مركز الاتصال لطلب المساعدة','طلب دعم فني عبر التطبيق'],
    payment:['سداد الفاتورة الشهرية','تأخر في سداد الفاتورة','تسوية فاتورة متأخرة'],
    renewal:['تجديد الباقة الحالية','ترقية إلى باقة أعلى']
  };
  const n = clamp(Math.round(c.complaints_count*0.6+c.support_calls*0.4)+2, 3, 7);
  for(let i=0;i<n;i++){
    const daysAgo = Math.round(r()*260);
    const kind = i===0 ? 'payment' : choice2(r,['complaint','support','payment','renewal']);
    const status = kind==='complaint' ? choice2(r,['تم الحل','قيد المعالجة','مصعّدة']) : kind==='support' ? choice2(r,['مكتملة','قيد المتابعة']) : kind==='payment' ? (c.payment_status==='معلق'&&i<2?'متأخرة':'مكتملة') : 'مكتملة';
    events.push({ date: new Date(TODAY.getTime()-daysAgo*86400000), kind, desc: templates[kind][Math.floor(r()*templates[kind].length)], status });
  }
  return events.sort((a,b)=>b.date-a.date);
}
function choice2(r,arr){ return arr[Math.floor(r()*arr.length)]; }

function statusColor(status){
  if(['تم الحل','مكتملة'].includes(status)) return 'var(--good)';
  if(['قيد المعالجة','قيد المتابعة'].includes(status)) return 'var(--accent)';
  return 'var(--critical)';
}
function kindLabel(k){ return {complaint:'شكوى', support:'مكالمة دعم', payment:'دفعة', renewal:'باقة/عقد'}[k]; }

function openDetail(id){
  state.selectedId = id;
  state.page = 'detail';
  route();
}

          <div class="pf-row"><span class="pf-k">مدة الاشتراك</span><span class="pf-v tabular">${c.tenure_months} شهر</span></div>
          <div class="pf-row"><span class="pf-k">متوسط الإنفاق الشهري</span><span class="pf-v tabular">${fmtNum(c.monthly_bill)} د.ل</span></div>
          <div class="pf-row"><span class="pf-k">نوع العقد</span><span class="pf-v">${esc(c.contract_type)}</span></div>
          <div class="pf-row"><span class="pf-k">حالة السداد</span><span class="pf-v">${esc(c.payment_status)}</span></div>

              <div class="action-btn" data-action="${i}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>

  gaugeChart(document.getElementById('gauge'), c.churn_probability, riskColorHex(c.risk_level).startsWith('#')?riskColorHex(c.risk_level):riskColor(c.risk_level));

/* ============================= toast ============================= */
let toastTimer=null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ============================= CSV export ============================= */
function toCSV(rows){
  const headers = ['customer_id','customer_name','region','plan_type','tenure_months','monthly_bill','average_data_usage','complaints_count','support_calls','payment_status','satisfaction_score','contract_type','churn_probability','risk_level','recommended_action'];
  const lines = [headers.join(',')];
  rows.forEach(c=>{
    lines.push(headers.map(h=>{
      let v = c[h]; if(v==null) v='';
      v = String(v).replace(/"/g,'""');
      return /[",\n]/.test(v) ? `"${v}"` : v;
    }).join(','));
  });
  return '﻿'+lines.join('\r\n');
}
async function exportHighRisk(){
  const rows = customers.filter(c=>c.risk_level==='مرتفع').sort((a,b)=>b.churn_probability-a.churn_probability);
  const csv = toCSV(rows);
  const filename = 'ltt-high-risk-customers.csv';
  try{
    if(window.claude && typeof window.claude.use==='function'){
      const downloads = await window.claude.use('downloads');
      if(downloads){
        try{ await downloads.save({filename, data:csv}); showToast('تم حفظ الملف: '+filename); return; }
        catch(err){ if(err && err.code==='declined') return; }
      }
    }
  }catch(e){}
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast('تم تنزيل الملف: '+filename);
}

/* ============================= header widgets ============================= */
function renderAlerts(){
  const risky = customers.filter(c=>c.churn_probability>75).sort((a,b)=>b.churn_probability-a.churn_probability);
  document.getElementById('alertCount').textContent = risky.length>99?'99+':risky.length;
  const list = document.getElementById('alertList');
  list.innerHTML = risky.length ? risky.slice(0,30).map(c=>`
    <div class="alert-row" data-id="${c.customer_id}">
      <span class="ar-pct tabular">${c.churn_probability.toFixed(0)}٪</span>
      <div class="ar-body"><div class="ar-name">${esc(c.customer_name)}</div><div class="ar-meta">${esc(c.region)} · ${esc(c.plan_type)}</div></div>
    </div>`).join('') : `<div class="dropdown-empty">لا توجد تنبيهات حالياً</div>`;
  list.querySelectorAll('.alert-row').forEach(r=>r.addEventListener('click', ()=>{ document.getElementById('alertPanel').classList.remove('open'); openDetail(r.dataset.id); }));
}

function wireHeader(){
  const alertBtn = document.getElementById('alertBtn'), alertPanel = document.getElementById('alertPanel');
  alertBtn.addEventListener('click', e=>{ e.stopPropagation(); alertPanel.classList.toggle('open'); });
  document.addEventListener('click', e=>{ if(!alertPanel.contains(e.target) && e.target!==alertBtn) alertPanel.classList.remove('open'); });

  document.getElementById('exportBtn').addEventListener('click', exportHighRisk);

  const searchInput = document.getElementById('globalSearch');
  const searchResults = document.getElementById('searchResults');
  searchInput.addEventListener('input', ()=>{
    const q = searchInput.value.trim();
    if(!q){ searchResults.classList.remove('open'); return; }
    const matches = customers.filter(c=>c.customer_name.includes(q) || c.customer_id.toLowerCase().includes(q.toLowerCase())).slice(0,8);
    searchResults.innerHTML = matches.length ? matches.map(c=>`
      <div class="search-result-row" data-id="${c.customer_id}">
        <div><div class="sr-name">${esc(c.customer_name)}</div><div class="sr-meta">${c.customer_id} · ${esc(c.region)}</div></div>
        <span class="pill ${pillClass(c.risk_level)}"><span class="dot"></span>${c.churn_probability.toFixed(0)}٪</span>
      </div>`).join('') : `<div class="dropdown-empty">لا توجد نتائج</div>`;
    searchResults.classList.add('open');
    searchResults.querySelectorAll('[data-id]').forEach(r=>r.addEventListener('click', ()=>{
      searchResults.classList.remove('open'); searchInput.value=''; openDetail(r.dataset.id);
    }));
  });
  document.addEventListener('click', e=>{ if(!searchResults.contains(e.target) && e.target!==searchInput) searchResults.classList.remove('open'); });

  document.getElementById('navToggleBtn').addEventListener('click', ()=> document.getElementById('navRail').classList.toggle('open'));

  document.getElementById('view-overview').addEventListener('click', ()=>{});
}

function wireOverviewSearch(){
  const input = document.getElementById('ovTableSearch');
  if(!input) return;
  input.value = state.ovSearch;
  input.addEventListener('input', ()=>{ state.ovSearch = input.value.trim(); renderOverviewTable(); });
}

/* ============================= router ============================= */
const PAGE_META = {
  overview:{title:'نظرة عامة', sub:'مؤشرات المغادرة على مستوى الشركة'},
  analysis:{title:'تحليل العملاء', sub:'فلاتر وتحليلات تفصيلية لأنماط المغادرة'},
  detail:{title:'تفاصيل العميل', sub:'ملف كامل وإجراءات احتفاظ مقترحة'}
};
function route(){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.page===state.page));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+state.page).classList.add('active');
  document.getElementById('pageTitle').textContent = PAGE_META[state.page].title;
  document.getElementById('pageSub').textContent = PAGE_META[state.page].sub;
  document.getElementById('navRail').classList.remove('open');
  if(state.page==='overview'){ renderOverview(); wireOverviewSearch(); }
  else if(state.page==='analysis'){ renderAnalysis(); }
  else if(state.page==='detail'){ renderDetail(); }
}

function init(){
  document.querySelectorAll('.nav-item').forEach(item=>{
    item.addEventListener('click', ()=>{ state.page = item.dataset.page; route(); });
  });
  wireHeader();
  renderAlerts();
  route();
  window.addEventListener('resize', ()=>{ route(); });
}
init();
})();
</script>
